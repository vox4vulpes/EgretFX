name: Release

# Push a tag like v1.0.0 to build every effect in the bundle (each submodule
# with a vst/ folder) on all three platforms and publish a GitHub release with
# an Egret-FX-Bundle zip per platform and a Windows installer. Each effect also
# has its own repository and releases; this one only ships them together. Run it by hand (workflow_dispatch) to build everything as
# workflow artifacts without publishing, e.g. to try the installer.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the test installer"
        default: "0.0.0"

jobs:
  # Fail fast, before the long builds, if CHANGELOG.md has no entry for this tag.
  changelog:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/changelog-section.sh "$GITHUB_REF_NAME"

  build:
    needs: changelog
    # Manual test builds skip the changelog check (it's skipped, not failed).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        # Pinned rather than ubuntu-latest so a runner image migration can't
        # silently break the apt package list below on release day.
        os: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Build, test and package every effect
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          platform=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          version=${VERSION#v}
          mkdir -p dist stage

          for cmakelists in */vst/CMakeLists.txt; do
            src=$(dirname "$cmakelists")
            fx=$(basename "$(dirname "$src")" | tr '[:upper:]' '[:lower:]')
            echo "::group::$fx"

            cmake -S "$src" -B "build/$fx" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$fx" --config Release --parallel

            test_exe=$(find "build/$fx" -type f \( -iname "EngineTest" -o -iname "EngineTest.exe" \) | head -n1)
            if [ -n "$test_exe" ]; then "$test_exe"; fi

            artefacts=$(find "build/$fx" -type d -path "*_artefacts/Release" | head -n1)
            mkdir -p "stage/$fx"
            cp -R "$artefacts/VST3" "stage/$fx/"
            # MSVC drops import libs next to the .vst3; they're build leftovers.
            find "stage/$fx/VST3" -maxdepth 1 \( -name '*.lib' -o -name '*.exp' \) -delete
            if [ -d "$artefacts/Standalone" ]; then cp -R "$artefacts/Standalone" "stage/$fx/"; fi
            cp LICENSE "stage/$fx/LICENSE.txt"
            echo "::endgroup::"
          done

          # Bundle files start with "1Bundle" so they list first, as before.
          mkdir -p bundle && cp -R stage bundle/Egret-FX-Bundle
          (cd bundle && cmake -E tar cf "../dist/1Bundle-Egret-FX-$version-$platform.zip" --format=zip Egret-FX-Bundle)
          ls -l dist

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          bash installer/windows/build-installer.sh "${VERSION#v}" stage dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## What's new"
            echo
            bash .github/scripts/changelog-section.sh "$GITHUB_REF_NAME"
            echo
          } > notes.md

          cat >> notes.md <<'EOF'
          ## Downloads

          - **`1Bundle-Egret-FX-Setup-<version>.exe`** — Windows installer for every effect (recommended on Windows)
          - **`1Bundle-Egret-FX-<version>-<platform>.zip`** — every Egret effect in one archive

          Each archive holds the VST3 plugin and a standalone app for each effect.
          Single effects have their own releases:
          [Egret EQ](https://github.com/vox4vulpes/EgretFX-EQ/releases/latest)

          ## Install

          **Windows:** run the installer — the bundle one, or a single effect's from its
          own release. It puts the plugins in `C:\Program Files\Common Files\VST3\Egret`,
          adds the standalone apps to the Start menu, and upgrades an existing install
          in place when you run a newer version. The bundle and single-effect installers
          share that folder, so installing both never shows a plugin twice. Windows SmartScreen may warn because the installer
          isn't code-signed: choose **More info -> Run anyway**.

          **Manual install:** copy the `.vst3` folder/file into your plugin folder and rescan in your DAW:

          | Platform | VST3 folder |
          |---|---|
          | Windows | `C:\Program Files\Common Files\VST3` |
          | macOS | `~/Library/Audio/Plug-Ins/VST3` |
          | Linux | `~/.vst3` |

          macOS builds are not signed or notarized. If macOS refuses to load them, run
          `xattr -dr com.apple.quarantine "<path to the .vst3 or .app>"` once.
          EOF

          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Egret FX $GITHUB_REF_NAME" \
            --notes-file notes.md
